<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Sign Up</h2>
    <p class="subtitle">Create an account to shorten your URLs.</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required formControlName="name">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required formControlName="email">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required formControlName="password">
      </div>
      
      <div class="form-actions">
        <button type="submit" class="primary-button" [disabled]="loginForm.invalid">Sign Up</button>
      </div>
    </form>
    
    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Log in</a></p>
    </div>
  </div>
</div>
