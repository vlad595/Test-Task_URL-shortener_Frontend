<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Log In</h2>
    <p class="subtitle">Welcome back! Please enter your details.</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required formControlName="email">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required formControlName="password">
      </div>
      
      <div class="form-actions">
        <button type="submit" class="primary-button" [disabled]="loginForm.invalid">Log In</button>
      </div>
    </form>
    
    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/reg">Sign up</a></p>
    </div>
  </div>
</div>
